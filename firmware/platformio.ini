; Mini Central de Monitoramento IoT - firmware das 3 ESP32
; Cenario: estacao de bombeamento de agua com 3 conjuntos motobomba.
; Projeto unico: o mesmo codigo atende as 3 maquinas; a identidade, a placa e
; os sensores fisicos de cada uma sao definidos por environment.
;
; Placas desta montagem (docs/10-esquema-eletrico.md, secao "Placas"):
;   M01  ESP32 DevKit      DHT22 + vazao YF-S201C + LED RGB
;   M02  ESP32-S3-N16R8    DHT22 + vazao YF-S402
;   M03  ESP32 DevKit      DHT22 + MQ (gas) + LED flash
; Para trocar a placa de uma maquina basta trocar o "extends"/"board" do
; environment (board = esp32dev, s3n16r8 ou s2mini): o mapa de pinos e
; escolhido pelo alvo compilado em config.h.
;
; Gravar:  pio run -e maquina01 -t upload
; Monitor: pio device monitor

[platformio]
default_envs = maquina01, maquina02, maquina03

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ------- Base opcional: LOLIN S2 Mini (nao usado nesta montagem) -------------
; Mantida para quem trocar alguma maquina por um S2 Mini: basta usar
; "extends = s2mini" no environment. Serial pela USB nativa (CDC).
; O S2 Mini nao tem chip USB-serial. Com estes flags o firmware sobe com a
; porta USB CDC ligada ("Serial" = USB), o monitor funciona e o PlatformIO
; consegue reiniciar a placa sozinho nas gravacoes seguintes (1200 bps touch).
; Eles ja vem no board lolin_s2_mini; ficam aqui explicitos de proposito.
; ATENCAO: antes da PRIMEIRA gravacao nenhum firmware nosso esta rodando,
; entao a porta so aparece com a placa em modo de gravacao (ROM): desligue o
; USB, segure "0", ligue o USB, solte "0". Confira com "pio device list"
; (deve listar VID:PID=303A:0002) e mande o upload.
; tools/pio_s2.py: ao terminar de gravar, o esptool reinicia o S2 e a porta
; some antes de ele fechar - sem o wrapper isso vira um FAILED falso e o
; "Upload and Monitor" nao abre o monitor.
[s2mini]
board = lolin_s2_mini
extra_scripts = post:tools/pio_s2.py
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0

; ------- Motobomba 01: ESP32 DevKit + DHT22 + vazao YF-S201C (1/2") + LED RGB --
; YF-S201C: f = 7,5 Hz por L/min (450 pulsos/L), faixa 1-30 L/min
; Vazao alimentada em 5 V (VIN) com divisor 10k/20k no GPIO 33 (docs/10).
; Gravar pela micro-USB; se travar em "Connecting...", segure BOOT.
[env:maquina01]
board = esp32dev
build_flags =
    -D MACHINE_ID=\"M01\"
    -D SENSOR_DHT22=1
    -D SENSOR_VAZAO=1
    -D FATOR_VAZAO_HZ_POR_LMIN=7.5f
    -D ATUADOR_LED_RGB=1

; ------- Base do ESP32-S3-N16R8 (formato DevKitC-1, 44 pinos) ------------------
; Gravar e monitorar pela porta USB-C marcada "UART" (ou "COM"): e o chip
; USB-serial da placa, com auto-reset - sem botao, sem wrapper. A porta "USB"
; vai direto ao chip e, com esta configuracao, nao mostra a serial.
; Flash de 16 MB (o board padrao assume 8 MB). A PSRAM de 8 MB (octal) fica
; desligada: o firmware nao precisa dela e, configurada errado, impede o boot.
; Para ligar: board_build.arduino.memory_type = qio_opi e -D BOARD_HAS_PSRAM.
[s3n16r8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; ------- Motobomba 02: S3-N16R8 + DHT22 + vazao YF-S402 (1/4") ----------------
; YF-S402: f = 73 Hz por L/min (4380 pulsos/L), faixa 0,3-6 L/min
; Vazao alimentada em 3V3 e sinal direto no GPIO 5, sem divisor: o pull-up
; vem da propria ESP32 (VAZAO_PULLUP_INTERNO). Validado em bancada: 28,6 Hz
; soprando na turbina. Para voltar a 5 V + divisor, remova a flag.
[env:maquina02]
extends = s3n16r8
build_flags =
    -D MACHINE_ID=\"M02\"
    -D SENSOR_DHT22=1
    -D SENSOR_VAZAO=1
    -D FATOR_VAZAO_HZ_POR_LMIN=73.0f
    -D VAZAO_PULLUP_INTERNO=1

; ------- Motobomba 03: ESP32 DevKit + DHT22 + MQ (gas) + LED flash de alarme --
[env:maquina03]
board = esp32dev
build_flags =
    -D MACHINE_ID=\"M03\"
    -D SENSOR_DHT22=1
    -D SENSOR_MQ=1
    -D ATUADOR_LED_FLASH=1

; ------- Modo bancada: mesma placa e sensores, SEM Wi-Fi/MQTT -----------------
; Imprime a leitura dos sensores (brutos + processados) a cada 2 s no monitor
; serial, para conferir a montagem antes de ligar a rede. Nao precisa do
; secrets.h. Uso: pio run -e maquina01_bancada -t upload -t monitor
[env:maquina01_bancada]
extends = env:maquina01
build_flags = ${env:maquina01.build_flags} -D MODO_BANCADA=1

[env:maquina02_bancada]
extends = env:maquina02
build_flags = ${env:maquina02.build_flags} -D MODO_BANCADA=1

[env:maquina03_bancada]
extends = env:maquina03
build_flags = ${env:maquina03.build_flags} -D MODO_BANCADA=1
