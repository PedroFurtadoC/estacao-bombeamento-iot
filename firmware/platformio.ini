; Firmware das 3 ESP32 da estacao de bombeamento.
; Um projeto so: o mesmo codigo atende as tres maquinas, e o que muda
; (identidade, placa, sensores) vem por build flag de cada environment.
;
;   M01  ESP32 DevKit      DHT22 + vazao YF-S201C + LED RGB
;   M02  ESP32-S3-N16R8    DHT22 + vazao YF-S402
;   M03  ESP32 DevKit      DHT22 + MQ (gas) + LED flash
;
; Trocar a placa de uma maquina = trocar o "board"/"extends" do environment;
; o mapa de pinos sai do alvo compilado, em src/config.h.
;
; Gravar:  pio run -e maquina01 -t upload
; Monitor: pio device monitor

[platformio]
default_envs = maquina01, maquina02, maquina03

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ------- Motobomba 01: DevKit + DHT22 + vazao YF-S201C + LED RGB -------------
; YF-S201C: 7,5 Hz por L/min (450 pulsos/L), 1 a 30 L/min.
; Vazao em 5 V (VIN) com divisor 10k/20k no GPIO 33.
; Se o upload travar em "Connecting...", segure BOOT.
[env:maquina01]
board = esp32dev
build_flags =
    -D MACHINE_ID=\"M01\"
    -D SENSOR_DHT22=1
    -D SENSOR_VAZAO=1
    -D FATOR_VAZAO_HZ_POR_LMIN=7.5f
    -D ATUADOR_LED_RGB=1

; ------- Base do ESP32-S3-N16R8 (formato DevKitC-1) --------------------------
; Gravar e monitorar pela porta USB-C marcada "UART": tem chip USB-serial e
; auto-reset. A porta "USB" nao mostra a serial com esta configuracao.
; Flash de 16 MB (o board padrao assume 8). A PSRAM fica desligada de
; proposito: o firmware nao precisa e, mal configurada, impede o boot.
[s3n16r8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; ------- Motobomba 02: S3-N16R8 + DHT22 + vazao YF-S402 ---------------------
; YF-S402: 73 Hz por L/min (4380 pulsos/L), 0,3 a 6 L/min.
; Vazao em 3V3, sinal direto no GPIO 5 e pull-up interno - sem divisor.
; Validado na bancada: 28,6 Hz soprando na turbina.
[env:maquina02]
extends = s3n16r8
build_flags =
    -D MACHINE_ID=\"M02\"
    -D SENSOR_DHT22=1
    -D SENSOR_VAZAO=1
    -D FATOR_VAZAO_HZ_POR_LMIN=73.0f
    -D VAZAO_PULLUP_INTERNO=1

; ------- Motobomba 03: DevKit + DHT22 + MQ (gas) + LED flash ----------------
[env:maquina03]
board = esp32dev
build_flags =
    -D MACHINE_ID=\"M03\"
    -D SENSOR_DHT22=1
    -D SENSOR_MQ=1
    -D ATUADOR_LED_FLASH=1

; ------- Base opcional: LOLIN S2 Mini ---------------------------------------
; Sem uso nesta montagem; fica para quem trocar alguma maquina por um S2 Mini
; ("extends = s2mini"). A placa nao tem chip USB-serial: a serial sai pela USB
; nativa e, antes da primeira gravacao, a porta so aparece com a placa em modo
; ROM (desligue o USB, segure "0", ligue, solte). Confira com "pio device list"
; (VID:PID=303A:0002).
; tools/pio_s2.py troca o esptool por um wrapper: ao terminar de gravar a placa
; reinicia e a porta some antes do esptool fechar, o que virava FAILED falso.
[s2mini]
board = lolin_s2_mini
extra_scripts = post:tools/pio_s2.py
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0

; ------- Modo bancada: mesma placa e sensores, sem Wi-Fi/MQTT ---------------
; Imprime a leitura (bruta e processada) a cada 2 s, para conferir a montagem
; antes de ligar a rede. Nao precisa de secrets.h.
; Uso: pio run -e maquina01_bancada -t upload -t monitor
[env:maquina01_bancada]
extends = env:maquina01
build_flags = ${env:maquina01.build_flags} -D MODO_BANCADA=1

[env:maquina02_bancada]
extends = env:maquina02
build_flags = ${env:maquina02.build_flags} -D MODO_BANCADA=1

[env:maquina03_bancada]
extends = env:maquina03
build_flags = ${env:maquina03.build_flags} -D MODO_BANCADA=1
