; Mini Central de Monitoramento IoT - firmware das 3 ESP32
; Cenario: estacao de bombeamento de agua com 3 conjuntos motobomba.
; Projeto unico: o mesmo codigo atende as 3 maquinas; a identidade e os
; sensores fisicos de cada uma sao definidos por build flags no environment.
;
; Gravar:  pio run -e maquina01 -t upload
; Monitor: pio device monitor

[platformio]
default_envs = maquina01, maquina02, maquina03

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ------- Motobomba 01: DHT22 + vazao (hall) + LED RGB de status -------
[env:maquina01]
build_flags =
    -D MACHINE_ID=\"M01\"
    -D SENSOR_DHT22=1
    -D SENSOR_VAZAO=1
    -D ATUADOR_LED_RGB=1

; ------- Motobomba 02: DHT22 + HW-484 (vibracao/cavitacao real) -----------
[env:maquina02]
build_flags =
    -D MACHINE_ID=\"M02\"
    -D SENSOR_DHT22=1
    -D SENSOR_SOM=1

; ------- Motobomba 03: DHT22 + MQ + vazao (hall) + LED flash de alarme -----
[env:maquina03]
build_flags =
    -D MACHINE_ID=\"M03\"
    -D SENSOR_DHT22=1
    -D SENSOR_MQ=1
    -D SENSOR_VAZAO=1
    -D ATUADOR_LED_FLASH=1
