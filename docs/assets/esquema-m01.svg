<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="esq" viewBox="0 0 760 557" role="img" aria-label="Esquema elétrico da M01: LOLIN S2 Mini com DHT22 no GPIO 7 (3,3 V), sensor de vazão YF-S201C em 5 V com divisor 10 kΩ/20 kΩ no GPIO 5 e LED RGB HW-479 nos GPIO 9, 11 e 12; GND comum."><style>:root{
--bg:#F1F4F7;--surface:#FFFFFF;--ink:#18212B;--muted:#5C6975;--line:#D6DDE4;--line-2:#E8EDF2;--accent:#0B6E7A;--code-bg:#EEF2F5;
--t-3v3:#E07414;--t-5v:#C62828;--w-gnd:#2A3138;--w-sig:#C99A06;--w-data:#2E7D32;--w-an:#1D5FBF;--w-led:#8E24AA;
--board-s2:#8C2A7E;--board-s2-fill:#F3DCEE;--board-wr:#2B323A;--board-wr-fill:#E3E8EE;--res:#F4E7C8;--res-line:#8A6A10;
}
.esq .paper{fill:var(--surface)}
.esq .placa{stroke-width:1.6;opacity:.95}
.esq .s2{fill:var(--board-s2-fill);stroke:var(--board-s2)}
.esq .dk{fill:var(--board-wr-fill);stroke:var(--board-wr)}
.esq .s3{fill:var(--board-wr-fill);stroke:var(--accent)}
.esq .mod{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.esq .etitle{font-size:13px;font-weight:700;font-family:"Archivo",system-ui,sans-serif}
.esq .esub{font-size:9px;fill:var(--muted);font-family:"Archivo",system-ui,sans-serif}
.esq .ptitle{font-size:11px;font-weight:700;font-family:"Archivo",system-ui,sans-serif}
.esq .psub{font-size:8px;fill:var(--muted);font-family:"Archivo",system-ui,sans-serif}
.esq .mtitle{font-size:10px;font-weight:700;font-family:"Archivo",system-ui,sans-serif}
.esq .msub{font-size:8px;fill:var(--muted);font-family:"Archivo",system-ui,sans-serif}
.esq .pinl{font-size:8.5px;font-weight:600}
.esq .pinl.dim{fill:var(--muted);font-weight:400}
.esq .fio{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.esq .w-3v3{stroke:var(--t-3v3)}.esq .w-5v{stroke:var(--t-5v)}.esq .w-gnd{stroke:var(--w-gnd)}
.esq .w-sig{stroke:var(--w-sig)}.esq .w-data{stroke:var(--w-data)}.esq .w-an{stroke:var(--w-an)}.esq .w-led{stroke:var(--w-led)}
.esq .flag{stroke-width:2.4;stroke-linecap:round}
.esq .flagl{font-size:9px;font-weight:700}
.esq .t-3v3{fill:var(--t-3v3)}.esq .t-5v{fill:var(--t-5v)}.esq .t-gnd{fill:var(--w-gnd)}
.esq .gnd{stroke:var(--w-gnd);stroke-width:1.8;stroke-linecap:round}
.esq .junc{fill:var(--ink)}
.esq .res{fill:var(--res);stroke:var(--res-line);stroke-width:1.2}
.esq .rlbl{font-size:8.5px;fill:var(--ink)}
.esq .wlbl{font-size:8.5px;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.esq .nota{font-size:8px;fill:var(--muted);font-family:"Archivo",system-ui,sans-serif}
.esq .nc{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:2 2}
.esq .legl{font-size:8.5px;fill:var(--muted);font-family:"Archivo",system-ui,sans-serif}
.esq text{font-family:"IBM Plex Mono",ui-monospace,monospace;fill:var(--ink)}
</style>
<rect class="paper" x="0" y="0" width="760" height="557"/>
<text class="etitle" x="24" y="26" text-anchor="start">Esquema elétrico · M01</text>
<text class="esub" x="24" y="40" text-anchor="start">LOLIN ESP32-S2 Mini · DHT22 + vazão YF-S201C + LED RGB HW-479 · environment maquina01</text>
<rect class="placa s2" x="70" y="130" width="150" height="350" rx="8"/>
<text class="ptitle" x="145.0" y="350" text-anchor="middle">LOLIN</text>
<text class="ptitle" x="145.0" y="364" text-anchor="middle">ESP32-S2 Mini</text>
<text class="psub" x="145.0" y="378" text-anchor="middle">só a fileira externa tem header</text>
<line class="fio w-5v" x1="105" y1="130" x2="105" y2="102"/>
