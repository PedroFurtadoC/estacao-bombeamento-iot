<text class="pinl" x="508" y="443" text-anchor="start">G</text>
<line class="fio w-led" x1="500" y1="458" x2="470" y2="458"/>
<text class="pinl" x="508" y="461" text-anchor="start">B</text>
<line class="fio w-gnd" x1="540" y1="470" x2="540" y2="492"/>
<line class="gnd" x1="531" y1="492" x2="549" y2="492"/>
<line class="gnd" x1="534.5" y1="496" x2="545.5" y2="496"/>
<line class="gnd" x1="538" y1="500" x2="542" y2="500"/>
<text class="pinl" x="540" y="465" text-anchor="middle">− (GND)</text>
<line class="fio w-led" x1="250" y1="422" x2="470" y2="422"/>
<line class="fio w-led" x1="250" y1="440" x2="470" y2="440"/>
<line class="fio w-led" x1="250" y1="458" x2="470" y2="458"/>
<text class="nota" x="550" y="443" text-anchor="start">verde normal · amarelo atenção · vermelho crítico</text>
<line class="fio w-3v3" x1="24" y1="537" x2="46" y2="537"/>
<text class="legl" x="52" y="540" text-anchor="start">3V3</text>
<line class="fio w-5v" x1="83.3" y1="537" x2="105.3" y2="537"/>
<text class="legl" x="111.3" y="540" text-anchor="start">5 V (VBUS / VIN)</text>
<line class="fio w-gnd" x1="208.89999999999998" y1="537" x2="230.89999999999998" y2="537"/>
<text class="legl" x="236.89999999999998" y="540" text-anchor="start">GND (nó comum)</text>
<line class="fio w-data" x1="324.29999999999995" y1="537" x2="346.29999999999995" y2="537"/>
<text class="legl" x="352.29999999999995" y="540" text-anchor="start">DATA do DHT22</text>
<line class="fio w-sig" x1="434.59999999999997" y1="537" x2="456.59999999999997" y2="537"/>
<text class="legl" x="462.59999999999997" y="540" text-anchor="start">pulsos da vazão</text>
<line class="fio w-led" x1="555.0999999999999" y1="537" x2="577.0999999999999" y2="537"/>
<text class="legl" x="583.0999999999999" y="540" text-anchor="start">LED</text>
<circle class="junc" cx="618.3999999999999" cy="537" r="3"/>
<text class="legl" x="626.3999999999999" y="540" text-anchor="start">junção</text>
<rect class="res" x="670.9999999999999" y="532" width="20" height="10" rx="0"/>
