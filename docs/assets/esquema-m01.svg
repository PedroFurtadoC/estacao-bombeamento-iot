<rect class="mod" x="500" y="250" width="200" height="70" rx="6"/>
<text class="mtitle" x="510" y="266" text-anchor="start">YF-S201C · vazão 1/2″</text>
<text class="msub" x="510" y="278" text-anchor="start">7,5 Hz por L/min · fios: vermelho, preto, amarelo</text>
<line class="fio w-sig" x1="500" y1="300" x2="470" y2="300"/>
<text class="pinl" x="508" y="303" text-anchor="start">SINAL (amarelo)</text>
<line class="fio w-5v" x1="660" y1="250" x2="660" y2="222"/>
<line class="flag w-5v" x1="651" y1="222" x2="669" y2="222"/>
<text class="flagl t-5v" x="660" y="215" text-anchor="middle">5 V (VBUS)</text>
<text class="pinl" x="660" y="263" text-anchor="middle">VCC (vermelho)</text>
<line class="fio w-gnd" x1="540" y1="320" x2="540" y2="342"/>
<line class="gnd" x1="531" y1="342" x2="549" y2="342"/>
<line class="gnd" x1="534.5" y1="346" x2="545.5" y2="346"/>
<line class="gnd" x1="538" y1="350" x2="542" y2="350"/>
