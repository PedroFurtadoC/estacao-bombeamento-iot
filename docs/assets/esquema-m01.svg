<line class="fio w-sig" x1="430" y1="300" x2="470" y2="300"/>
<line class="fio w-sig" x1="340" y1="300" x2="340" y2="318"/>
<rect class="res" x="334" y="318" width="12" height="40" rx="0"/>
<text class="rlbl" x="350" y="341" text-anchor="start">R2 20 kΩ</text>
<line class="fio w-gnd" x1="340" y1="358" x2="340" y2="370"/>
<line class="gnd" x1="331" y1="370" x2="349" y2="370"/>
<line class="gnd" x1="334.5" y1="374" x2="345.5" y2="374"/>
<line class="gnd" x1="338" y1="378" x2="342" y2="378"/>
<circle class="junc" cx="340" cy="300" r="3"/>
<text class="wlbl" x="332" y="294" text-anchor="end">≤ 3,3 V</text>
<text class="nota" x="328" y="334" text-anchor="end">divisor de tensão</text>
<text class="nota" x="328" y="345" text-anchor="end">5 V → 3,3 V</text>
<rect class="mod" x="500" y="375" width="200" height="95" rx="6"/>
<text class="mtitle" x="510" y="391" text-anchor="start">HW-479 · LED RGB</text>
<text class="msub" x="510" y="403" text-anchor="start">catodo comum, resistores de 150 Ω na placa</text>
