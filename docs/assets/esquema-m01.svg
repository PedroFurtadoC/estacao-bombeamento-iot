<text class="pinl" x="214" y="193" text-anchor="end">GPIO 7</text>
<line class="fio w-sig" x1="220" y1="300" x2="250" y2="300"/>
<text class="pinl" x="214" y="303" text-anchor="end">GPIO 5</text>
<line class="fio w-led" x1="220" y1="422" x2="250" y2="422"/>
<text class="pinl" x="214" y="425" text-anchor="end">GPIO 9</text>
<line class="fio w-led" x1="220" y1="440" x2="250" y2="440"/>
<text class="pinl" x="214" y="443" text-anchor="end">GPIO 11</text>
<line class="fio w-led" x1="220" y1="458" x2="250" y2="458"/>
<text class="pinl" x="214" y="461" text-anchor="end">GPIO 12</text>
<line class="fio w-gnd" x1="145" y1="480" x2="145" y2="504"/>
<line class="gnd" x1="136" y1="504" x2="154" y2="504"/>
