<line class="gnd" x1="538" y1="365" x2="542" y2="365"/>
<text class="pinl" x="540" y="330" text-anchor="middle">GND</text>
<line class="fio w-an" x1="250" y1="300" x2="390" y2="300"/>
<rect class="res" x="390" y="294" width="40" height="12" rx="0"/>
<text class="rlbl" x="410" y="290" text-anchor="middle">R1 10 kΩ</text>
