<rect class="mod" x="500" y="250" width="200" height="85" rx="6"/>
<text class="mtitle" x="510" y="266" text-anchor="start">MQ-2 / MQ-135 · gás</text>
<text class="msub" x="510" y="278" text-anchor="start">aquecedor em 5 V, ~150 mA · ~2 min para estabilizar</text>
<line class="fio w-an" x1="500" y1="300" x2="470" y2="300"/>
<text class="pinl" x="508" y="303" text-anchor="start">A0 (analógico)</text>
<line class="nc" x1="500" y1="318" x2="486" y2="318"/>
<text class="pinl dim" x="482" y="321" text-anchor="end">não ligar</text>
<text class="pinl" x="508" y="321" text-anchor="start">D0</text>
