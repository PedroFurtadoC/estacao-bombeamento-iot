<line class="fio w-an" x1="340" y1="300" x2="340" y2="318"/>
<rect class="res" x="334" y="318" width="12" height="40" rx="0"/>
<text class="rlbl" x="350" y="341" text-anchor="start">R2 20 kΩ</text>
<line class="fio w-gnd" x1="340" y1="358" x2="340" y2="370"/>
<line class="gnd" x1="331" y1="370" x2="349" y2="370"/>
<line class="gnd" x1="334.5" y1="374" x2="345.5" y2="374"/>
<line class="gnd" x1="338" y1="378" x2="342" y2="378"/>
<circle class="junc" cx="340" cy="300" r="3"/>
<text class="wlbl" x="332" y="294" text-anchor="end">≤ 3,3 V</text>
<text class="nota" x="328" y="334" text-anchor="end">divisor de tensão</text>
<text class="nota" x="328" y="345" text-anchor="end">até 5 V → 3,3 V</text>
<rect class="mod" x="500" y="385" width="200" height="80" rx="6"/>
<text class="mtitle" x="510" y="401" text-anchor="start">HW-481 · LED flash</text>
<text class="msub" x="510" y="413" text-anchor="start">resistor de 100 Ω na placa · pinos S / NC / −</text>
<line class="fio w-led" x1="500" y1="432" x2="470" y2="432"/>
<text class="pinl" x="508" y="435" text-anchor="start">S</text>
<line class="nc" x1="500" y1="448" x2="486" y2="448"/>
<text class="pinl dim" x="482" y="451" text-anchor="end">não ligar</text>
<text class="pinl" x="508" y="451" text-anchor="start">NC</text>
<line class="fio w-gnd" x1="540" y1="465" x2="540" y2="487"/>
<line class="gnd" x1="531" y1="487" x2="549" y2="487"/>
<line class="gnd" x1="534.5" y1="491" x2="545.5" y2="491"/>
<line class="gnd" x1="538" y1="495" x2="542" y2="495"/>
<text class="pinl" x="540" y="460" text-anchor="middle">− (GND)</text>
<line class="fio w-led" x1="250" y1="432" x2="470" y2="432"/>
<text class="wlbl" x="360.0" y="426" text-anchor="middle">acionado direto pelo GPIO</text>
<text class="nota" x="24" y="522" text-anchor="start">Alimente a DevKit por uma porta USB boa ou carregador de 5 V / 1 A: o aquecedor do MQ derruba a placa nos picos de Wi-Fi.</text>
<line class="fio w-3v3" x1="24" y1="545" x2="46" y2="545"/>
<text class="legl" x="52" y="548" text-anchor="start">3V3</text>
<line class="fio w-5v" x1="83.3" y1="545" x2="105.3" y2="545"/>
<text class="legl" x="111.3" y="548" text-anchor="start">5 V (VBUS / VIN)</text>
<line class="fio w-gnd" x1="208.89999999999998" y1="545" x2="230.89999999999998" y2="545"/>
<text class="legl" x="236.89999999999998" y="548" text-anchor="start">GND (nó comum)</text>
<line class="fio w-data" x1="324.29999999999995" y1="545" x2="346.29999999999995" y2="545"/>
<text class="legl" x="352.29999999999995" y="548" text-anchor="start">DATA do DHT22</text>
<line class="fio w-an" x1="434.59999999999997" y1="545" x2="456.59999999999997" y2="545"/>
<text class="legl" x="462.59999999999997" y="548" text-anchor="start">analógico (A0)</text>
<line class="fio w-led" x1="550.0" y1="545" x2="572.0" y2="545"/>
<text class="legl" x="578.0" y="548" text-anchor="start">LED</text>
<circle class="junc" cx="613.3" cy="545" r="3"/>
<text class="legl" x="621.3" y="548" text-anchor="start">junção</text>
<rect class="res" x="665.9" y="540" width="20" height="10" rx="0"/>
<text class="legl" x="691.9" y="548" text-anchor="start">resistor</text>
</svg>
