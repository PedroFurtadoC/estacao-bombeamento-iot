<line class="flag w-5v" x1="651" y1="222" x2="669" y2="222"/>
<text class="flagl t-5v" x="660" y="215" text-anchor="middle">5 V (VIN)</text>
<text class="pinl" x="660" y="263" text-anchor="middle">VCC</text>
<line class="fio w-gnd" x1="540" y1="335" x2="540" y2="357"/>
<line class="gnd" x1="531" y1="357" x2="549" y2="357"/>
