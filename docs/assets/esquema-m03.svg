<text class="mtitle" x="510" y="156" text-anchor="start">DHT22 / AM2302</text>
<text class="msub" x="510" y="168" text-anchor="start">módulo de 3 pinos, pull-up já na placa</text>
<line class="fio w-data" x1="500" y1="190" x2="470" y2="190"/>
<text class="pinl" x="508" y="193" text-anchor="start">DATA</text>
