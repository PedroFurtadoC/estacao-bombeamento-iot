# Mosquitto - configuracao didatica (rede local do hotspot)
# Em producao: TLS (8883), allow_anonymous false e ACL por dispositivo
# (ver docs/06-seguranca.md)

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type notice

# Fila por assinante: o backfill do simulador publica 2000+ mensagens em
# rajada; com o padrao (1000) o broker descartava o excedente antes de a
# ingestao conseguir gravar.
max_queued_messages 20000
