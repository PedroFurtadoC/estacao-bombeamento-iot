# Configuracao de bancada, na rede do hotspot.
# Em producao: TLS na 8883, allow_anonymous false e ACL por dispositivo
# (docs/06-seguranca.md).

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type notice

# O backfill publica 2000+ mensagens em rajada e o padrao (1000) descartava
# o excedente antes de a ingestao gravar.
max_queued_messages 20000
