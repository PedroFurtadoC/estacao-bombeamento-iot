# Carrega automaticamente os dashboards JSON desta pasta.
apiVersion: 1

providers:
  - name: mini-central
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
