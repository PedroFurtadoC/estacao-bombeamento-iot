# Regras de alerta provisionadas como codigo.
# Sobem junto com o Grafana, igual ao dashboard e ao datasource.
# Responde na pratica a pergunta 6 do Desafio 4.

apiVersion: 1
groups:
    - orgId: 1
      name: estacao-bombeamento
      folder: Alertas da estacao
      interval: 1m
      rules:
        - uid: ffyhec7bojk00b
          title: Temperatura critica na motobomba
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: influxdb-iot
              model:
                datasource:
                    type: influxdb
                    uid: influxdb-iot
                intervalMs: 1000
                maxDataPoints: 43200
                query: |-
                    from(bucket: "iot")
                      |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                      |> filter(fn: (r) => r._measurement == "telemetria" and r._field == "temperature")
                      |> aggregateWindow(every: 1m, fn: mean, createEmpty: false)
                      |> keep(columns: ["_time", "_value", "machine"])
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 80
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: ""
          panelId: 0
          noDataState: NoData
          execErrState: Alerting
          for: 1m
          annotations:
            description: 'Faixa critica definida no enunciado: acima de 80 C. Verificar ventilacao, sobrecarga e desgaste de rolamento.'
            summary: Temperatura acima de 80 C na motobomba {{ $labels.machine }}
          labels:
            origem: estacao-bombeamento
            severidade: critico
          isPaused: false
        - uid: efyhepgrsj9q8c
          title: Vibracao critica (possivel cavitacao)
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: influxdb-iot
              model:
                datasource:
                    type: influxdb
                    uid: influxdb-iot
                intervalMs: 1000
                maxDataPoints: 43200
                query: |-
                    from(bucket: "iot")
                      |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                      |> filter(fn: (r) => r._measurement == "telemetria" and r._field == "vibration")
                      |> aggregateWindow(every: 1m, fn: mean, createEmpty: false)
                      |> keep(columns: ["_time", "_value", "machine"])
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 5
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Alerting
          for: 1m
          annotations:
            description: Vibracao nessa faixa indica cavitacao ou desgaste de rolamento. Verificar pressao de succao e alinhamento do conjunto.
            summary: Vibracao acima de 5 mm/s na motobomba {{ $labels.machine }}
          labels:
            origem: estacao-bombeamento
            severidade: critico
          isPaused: false
